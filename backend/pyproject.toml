[project]
name = "gamereview-backend"
version = "0.1.0"
description = "GameReview API - Django REST Framework backend"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["apps"]
python_files = ["test_*.py"]
addopts = "-ra"
